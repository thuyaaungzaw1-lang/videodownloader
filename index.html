<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Service Moved – ThuYaAungZaw</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0000">

  <style>
    :root {
      --accent: #ff2e2e;
      --accent-soft: rgba(255, 46, 46, 0.18);
      --bg: #050000;
      --text: #fbeaea;
      --muted: #b89494;
      --danger: #ff6b6b;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto;
      min-height:100vh;
      color:var(--text);
      background:
        linear-gradient(rgba(10,0,0,.9), rgba(0,0,0,.98)),
        url('https://wallpapers.com/images/featured-full/kaneki-xsv5e4ut8mxmqae9.jpg') center/cover fixed;
      display:flex;align-items:center;justify-content:center;
      padding:20px;
      overflow:hidden;
      position:relative;
    }
    body::before{
      content:"";position:fixed;inset:0;pointer-events:none;
      background:
        radial-gradient(circle at 18% 20%, rgba(255,46,46,.18), transparent 55%),
        radial-gradient(circle at 82% 78%, rgba(255,0,0,.2), transparent 55%);
      mix-blend-mode:screen;
    }
    .scanline{position:fixed;inset:0;background-image:linear-gradient(to bottom,rgba(255,0,0,.15)0,transparent 2px);background-size:100% 4px;opacity:.12;pointer-events:none}

    .wrapper{max-width:480px;width:100%;z-index:1}
    .card{
      position:relative;overflow:hidden;
      background:radial-gradient(120% 120% at 0% 0%,rgba(40,0,0,.96),rgba(0,0,0,.98));
      border-radius:28px;
      padding:40px 24px;
      box-shadow:0 24px 60px rgba(0,0,0,.96), 0 0 18px rgba(255,46,46,.35);
      border:1px solid rgba(255,46,46,.35);
      backdrop-filter:blur(22px);
      -webkit-backdrop-filter:blur(22px);
      text-align: center;
    }

    .badge{
      display:inline-flex;gap:8px;align-items:center;
      padding:6px 12px;border-radius:999px;
      font-size:11px;letter-spacing:.08em;text-transform:uppercase;
      color:var(--muted);background:rgba(0,0,0,.7);
      border:1px solid rgba(255,46,46,.6);
      margin-bottom: 20px;
    }
    .dot{
      width:8px;height:8px;border-radius:999px;
      background:var(--accent);
      box-shadow:0 0 10px rgba(255,46,46,.9);
      animation:ping 1.8s infinite;
    }
    @keyframes ping{
      0%{transform:scale(1);opacity:1}
      60%{transform:scale(1.8);opacity:0}
    }

    h1{font-size:26px;margin-bottom:16px;background:linear-gradient(90deg,#ff6b6b,#fff,#ff2e2e);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    
    .notice-box {
        background: rgba(255, 46, 46, 0.1);
        border: 1px dashed rgba(255, 46, 46, 0.4);
        padding: 15px;
        border-radius: 16px;
        margin-bottom: 24px;
    }

    .sub{font-size:15px;color:var(--text);line-height:1.6;margin-bottom:20px}
    .bot-id { color: var(--accent); font-weight: bold; display: block; margin-top: 8px; font-size: 16px; }

    .btn{
      width:100%;border:0;border-radius:16px;
      padding:16px 20px;font-size:16px;font-weight:600;
      cursor:pointer;color:#fff;text-decoration: none;
      background:
        radial-gradient(circle at 0% 0%, #ff6b6b, #ff2e2e),
        linear-gradient(90deg, #8b0000,#ff2e2e,#ff6b6b);
      box-shadow:0 0 20px rgba(255,46,46,0.5);
      display:flex;align-items:center;justify-content:center;gap:12px;
      transition: transform 0.2s;
    }
    .btn:hover { transform: scale(1.02); }
    .btn:active { transform: scale(0.98); }

    .footer{
      margin-top:24px;
      font-size:12px;color:var(--muted);
    }
    .footer a{color:var(--accent);text-decoration:none;font-weight:500}
  </style>
</head>
<body>
  <div class="scanline"></div>

  <div class="wrapper">
    <div class="card">
      <div class="badge"><span class="dot"></span><strong>Maintenance Notice</strong></div>

      <h1>Service Moved</h1>
      
      <div class="notice-box">
        <p class="sub">
            ဒီ Website အသုံးပြုမှုကို ခေတ္တရပ်နားထားပါသည်။ ပိုမိုမြန်ဆန်ကောင်းမွန်သော Service ကို ရယူနိုင်ရန် ကျွန်ုပ်တို့၏ <b>Telegram Bot</b> တွင် အသုံးပြုပေးပါရန် မေတ္တာရပ်ခံအပ်ပါသည်။
            <span class="bot-id">@thuya_videodownloader_bot</span>
        </p>
      </div>

      <a href="https://t.me/thuya_videodownloader_bot" class="btn">
        <span>Go to Telegram Bot</span>
        <span style="font-size: 20px;">🚀</span>
      </a>

      <div class="footer">
        <span>Developed by <strong>ThuYaAungZaw</strong></span><br><br>
        <a href="https://www.facebook.com/thura.aungzaw.69" target="_blank" rel="noopener">Contact Support</a>
      </div>
    </div>
  </div>
</body>
</html>
